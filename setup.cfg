[metadata]
name = IEDA
version = 1.0.0
author = José de Anchita de Oliveira Filho
description = Intermolecular Electronic Density Analyzer (IEDA).
long_description = file: README.md
long_description_content_type = text/markdown
author_email = anchieta.oliveira@biof.ufrj.br
url = https://github.com/anchieta-oliveira/IEDA
license = MIT
classifiers =
    Intended Audience :: Developers
    Intended Audience :: Science/Research
    License :: OSI Approved :: MIT License
    Programming Language :: Python :: 3.10
    Operating System :: OS Independent

[options]
packages = find:
py_modules = main
python_requires = >=3.10
install_requires =
    numba
    numpy
    scipy
    pandas
    matplotlib
    seaborn
    fire

[options.entry_points]
console_scripts =
    IEDA = main:main
